<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box Model & Display Lab</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .box-container { display: flex; gap: 20px; margin-top: 20px; }
        #box1 {
            background-color: lightblue;
            border: 5px solid navy;
            padding: 20px;
            margin: 20px;
            width: 200px;
            height: 100px;
        }
        #box2 {
            background-color: lightcoral;
            width: 150px;
            height: 100px;
        }
        .controls { margin-top: 20px; background: #f4f4f4; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>CSS Box Model & Display Playground</h1>
    <div class="box-container">
        <div id="box1">Box 1 (Controlled)</div>
        <div id="box2">Box 2</div>
    </div>
    
    <div class="controls">
        <p>Interactive controls for Box 1 can be placed here.</p>
    </div>
</body>
</html>

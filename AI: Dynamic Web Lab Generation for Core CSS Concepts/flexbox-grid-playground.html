<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox and Grid Playground</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container {
            display: flex;
            background-color: #e2e8f0;
            height: 300px;
            gap: 10px;
            padding: 10px;
            border: 2px dashed #cbd5e1;
        }
        .item {
            background-color: #3b82f6;
            color: white;
            padding: 20px;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Flexbox & Grid Playground</h1>
    <div class="container" id="flexContainer">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>
</body>
</html>

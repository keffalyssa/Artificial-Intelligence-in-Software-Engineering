<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Box Model Interactive Lab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: row;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .control-panel {
            width: 350px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .control-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .stage {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            margin-left: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            position: relative;
            min-height: 400px;
        }
        .box-container {
            display: block;
        }
        .box {
            background-color: #3498db;
            color: white;
            text-align: center;
            font-weight: bold;
            box-sizing: content-box;
            transition: all 0.1s ease;
        }
        .box-2 {
            width: 150px;
            height: 50px;
            background-color: #e74c3c;
            margin-top: 20px;
            text-align: center;
            line-height: 50px;
            color: white;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <h3>Box Model Controls</h3>
        <div class="control-group">
            <label>Display Property:</label>
            <select id="displaySelect">
                <option value="block">block</option>
                <option value="inline-block">inline-block</option>
                <option value="inline">inline</option>
            </select>
        </div>
        <div class="control-group">
            <label>Width: <span id="widthVal">200</span>px</label>
            <input type="range" id="widthRange" min="50" max="400" value="200">
        </div>
        <h4>Padding (Sides)</h4>
        <div class="control-group"><label>Top: <span id="ptVal">10</span>px</label><input type="range" id="ptRange" min="0" max="50" value="10"></div>
        <div class="control-group"><label>Right: <span id="prVal">10</span>px</label><input type="range" id="prRange" min="0" max="50" value="10"></div>
        <div class="control-group"><label>Bottom: <span id="pbVal">10</span>px</label><input type="range" id="pbRange" min="0" max="50" value="10"></div>
        <div class="control-group"><label>Left: <span id="plVal">10</span>px</label><input type="range" id="plRange" min="0" max="50" value="10"></div>
        
        <h4>Margin (Sides)</h4>
        <div class="control-group"><label>Top: <span id="mtVal">10</span>px</label><input type="range" id="mtRange" min="0" max="50" value="10"></div>
        <div class="control-group"><label>Left: <span id="mlVal">10</span>px</label><input type="range" id="mlRange" min="0" max="50" value="10"></div>

        <h4>Border & Radius</h4>
        <div class="control-group"><label>Border Width: <span id="bwVal">5</span>px</label><input type="range" id="bwRange" min="0" max="20" value="5"></div>
        <div class="control-group"><label>Corner Radius: <span id="brVal">0</span>px</label><input type="range" id="brRange" min="0" max="50" value="0"></div>
    </div>

    <div class="stage">
        <div class="box-container" id="containerDiv">
            <div class="box" id="box1">Box 1 (Controlled)</div>
            <div class="box-2">Box 2 (Reference)</div>
        </div>
    </div>

    <script>
        const box1 = document.getElementById('box1');
        const containerDiv = document.getElementById('containerDiv');
        const displaySelect = document.getElementById('displaySelect');
        const widthRange = document.getElementById('widthRange');
        const ptRange = document.getElementById('ptRange');
        const prRange = document.getElementById('prRange');
        const pbRange = document.getElementById('pbRange');
        const plRange = document.getElementById('plRange');
        const mtRange = document.getElementById('mtRange');
        const mlRange = document.getElementById('mlRange');
        const bwRange = document.getElementById('bwRange');
        const brRange = document.getElementById('brRange');

        function updateBox() {
            containerDiv.style.display = displaySelect.value;
            box1.style.width = widthRange.value + 'px';
            widthVal.innerText = widthRange.value;

            box1.style.paddingTop = ptRange.value + 'px'; ptVal.innerText = ptRange.value;
            box1.style.paddingRight = prRange.value + 'px'; prVal.innerText = prRange.value;
            box1.style.paddingBottom = pbRange.value + 'px'; pbVal.innerText = pbRange.value;
            box1.style.paddingLeft = plRange.value + 'px'; plVal.innerText = plRange.value;

            box1.style.marginTop = mtRange.value + 'px'; mtVal.innerText = mtRange.value;
            box1.style.marginLeft = mlRange.value + 'px'; mlVal.innerText = mlRange.value;

            box1.style.borderWidth = bwRange.value + 'px';
            box1.style.borderStyle = 'solid';
            box1.style.borderColor = '#2c3e50';
            bwVal.innerText = bwRange.value;

            box1.style.borderRadius = brRange.value + 'px';
            brVal.innerText = brRange.value;
        }

        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('input', updateBox);
        });

        updateBox();
    </script>
</body>
</html>
